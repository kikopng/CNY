<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Can AI Beat Roulette? — Episode 2</title>
<style>
  :root {
    --bg: #07090d;
    --panel: rgba(11, 16, 23, .82);
    --panel2: rgba(18, 24, 34, .72);
    --line: rgba(255,255,255,.10);
    --text: #f5f7fb;
    --muted: #a8b0bf;
    --cyan: #63e6ff;
    --green: #69e88c;
    --red: #ff5a67;
    --amber: #ffc857;
    --purple: #a98bff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #020305; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; }
  button { font: inherit; }

  #stage {
    position: relative;
    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7777778vw);
    aspect-ratio: 9 / 16;
    overflow: hidden;
    color: var(--text);
    background:
      radial-gradient(circle at 50% 25%, rgba(72, 94, 125, .18), transparent 37%),
      radial-gradient(circle at 20% 80%, rgba(58, 220, 255, .07), transparent 26%),
      linear-gradient(180deg, #080b10 0%, #05070b 55%, #020306 100%);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 40px 100px rgba(0,0,0,.55);
    isolation: isolate;
    container-type: size;
  }

  #grid, #vignette, #scanlines, #particles, #fx { position: absolute; inset: 0; pointer-events: none; }
  #grid {
    opacity: .35;
    background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.8), transparent 78%);
  }
  #scanlines { opacity: .055; background: repeating-linear-gradient(180deg, rgba(255,255,255,.35) 0 1px, transparent 1px 6px); mix-blend-mode: soft-light; }
  #vignette { background: radial-gradient(circle at 50% 45%, transparent 45%, rgba(0,0,0,.45) 100%); z-index: 40; }
  #fx { z-index: 80; }
  #flash { position:absolute; inset:0; opacity:0; background:#fff; mix-blend-mode:screen; }
  #shake { position:absolute; inset:0; }

  .topbar { position:absolute; left:0; right:0; top:0; min-height:88px; padding:26px 42px 18px; display:flex; justify-content:space-between; align-items:flex-start; z-index:120; font-size:18px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); background:linear-gradient(180deg, rgba(7,9,13,.98) 0%, rgba(7,9,13,.94) 72%, rgba(7,9,13,0) 100%); pointer-events:none; }
  .eyebrow { display:flex; gap:12px; align-items:center; }
  .dot { width:8px; height:8px; border-radius:999px; background:var(--cyan); box-shadow:0 0 16px var(--cyan); }
  .simtag { padding:8px 13px; border:1px solid var(--line); border-radius:999px; background:rgba(0,0,0,.28); backdrop-filter:blur(8px); }

  /* Reserve a dedicated header-safe zone so scene typography can never collide with the persistent title. */
  #content { position:absolute; left:0; right:0; top:96px; bottom:0; z-index:20; }
  .scene { position:absolute; inset:0; opacity:0; pointer-events:none; transform:translateZ(0); }
  .scene.active { opacity:1; }

  .center { position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); width:88%; max-width:94%; text-align:center; }
  .row { display:flex; align-items:center; justify-content:center; gap:18px; }
  .stack { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .label { font-size:20px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .huge { font-weight:900; line-height:.92; letter-spacing:-.045em; font-size:clamp(48px,12.5cqw,138px); max-width:100%; overflow-wrap:anywhere; }
  .mega { font-weight:900; line-height:.92; letter-spacing:-.045em; font-size:clamp(52px,13.8cqw,150px); max-width:100%; margin-inline:auto; overflow-wrap:anywhere; word-break:normal; }
  .title { font-weight:900; font-size:clamp(32px,6.5cqw,70px); line-height:1; letter-spacing:-.035em; max-width:100%; margin-inline:auto; overflow-wrap:anywhere; }
  .mid { font-weight:850; font-size:clamp(24px,4.5cqw,48px); line-height:1; letter-spacing:-.03em; max-width:100%; }
  .small { font-size:clamp(16px,2.6cqw,28px); color:var(--muted); }
  .cyan { color:var(--cyan); text-shadow:0 0 28px rgba(99,230,255,.24); }
  .green { color:var(--green); text-shadow:0 0 28px rgba(105,232,140,.22); }
  .red { color:var(--red); text-shadow:0 0 28px rgba(255,90,103,.22); }
  .amber { color:var(--amber); text-shadow:0 0 28px rgba(255,200,87,.22); }
  .muted { color:var(--muted); }

  .pillrow { display:flex; gap:16px; justify-content:center; margin-top:24px; }
  .pill { padding:14px 20px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.045); font-size:22px; letter-spacing:.08em; text-transform:uppercase; }

  .card { border:1px solid var(--line); border-radius:28px; background:linear-gradient(180deg, rgba(16,23,34,.78), rgba(7,11,16,.92)); box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 24px 60px rgba(0,0,0,.25); }
  .experiment { width:88%; max-width:900px; margin:0 auto; padding:clamp(22px,3cqw,32px); }
  .exp-grid { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px; }
  .metric .value { font-weight:900; font-size:clamp(22px,5.9cqw,64px); line-height:1; white-space:nowrap; }
  .metric .caption { color:var(--muted); text-transform:uppercase; letter-spacing:.15em; font-size:clamp(10px,1.5cqw,16px); margin-bottom:10px; }
  .arrow { color:var(--muted); font-size:42px; }

  .dial { width:min(370px,34cqw); height:min(370px,34cqw); border-radius:50%; margin:0 auto 30px; position:relative; border:11px solid rgba(255,255,255,.07); box-shadow:0 0 80px rgba(0,0,0,.35), inset 0 0 60px rgba(0,0,0,.3); background: conic-gradient(from -5deg, #20252d 0 12deg, #0f131a 12deg 24deg, #20252d 24deg 36deg, #0f131a 36deg 48deg, #20252d 48deg 60deg, #0f131a 60deg 72deg, #20252d 72deg 84deg, #0f131a 84deg 96deg, #20252d 96deg 108deg, #0f131a 108deg 120deg, #20252d 120deg 132deg, #0f131a 132deg 144deg, #20252d 144deg 156deg, #0f131a 156deg 168deg, #20252d 168deg 180deg, #0f131a 180deg 192deg, #20252d 192deg 204deg, #0f131a 204deg 216deg, #20252d 216deg 228deg, #0f131a 228deg 240deg, #20252d 240deg 252deg, #0f131a 252deg 264deg, #20252d 264deg 276deg, #0f131a 276deg 288deg, #20252d 288deg 300deg, #0f131a 300deg 312deg, #20252d 312deg 324deg, #0f131a 324deg 336deg, #20252d 336deg 348deg, #0f131a 348deg 360deg); }
  .dial::before { content:""; position:absolute; inset:46px; border-radius:50%; border:2px solid rgba(255,255,255,.1); background:radial-gradient(circle, #141922 0 42%, #0b0e14 43% 100%); box-shadow:inset 0 0 35px rgba(0,0,0,.6); }
  .dial::after { content:"0"; position:absolute; inset:0; display:grid; place-items:center; font-size:64px; font-weight:900; color:var(--green); text-shadow:0 0 24px rgba(105,232,140,.25); }
  .wheelspin { --spin-angle: 0deg; transform: rotate(var(--spin-angle)); }
  @keyframes spin { to { transform:rotate(360deg); } }

  .lossbox { width:74%; margin:0 auto; padding:30px 36px; position:relative; overflow:hidden; }
  .lossline { display:flex; justify-content:space-between; align-items:end; gap:20px; }
  .lossline + .lossline { margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .lossnum { font-size:clamp(36px,6.3cqw,66px); font-weight:900; line-height:1; white-space:nowrap; }
  .strike { position:absolute; left:8%; right:8%; top:52%; height:3px; background:var(--red); transform:rotate(-7deg); box-shadow:0 0 20px rgba(255,90,103,.35); opacity:.9; }

  .testgrid { width:88%; margin:30px auto 0; display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .testcell { height:74px; border:1px solid var(--line); border-radius:14px; display:grid; place-items:center; font-size:20px; font-weight:800; background:rgba(255,255,255,.035); }
  .testcell.loss { border-color:rgba(255,90,103,.35); color:var(--red); background:rgba(255,90,103,.07); }
  .testcell.win { border-color:rgba(105,232,140,.28); color:var(--green); background:rgba(105,232,140,.06); }

  .ai-box { width:90%; max-width:920px; margin:0 auto; padding:clamp(22px,3.2cqw,34px); }
  .ai-head { display:flex; align-items:center; justify-content:space-between; }
  .ai-chip { padding:10px 16px; border:1px solid rgba(99,230,255,.28); background:rgba(99,230,255,.06); border-radius:12px; color:var(--cyan); font-weight:800; font-size:19px; letter-spacing:.13em; }
  .stream { margin-top:24px; display:grid; gap:11px; }
  .streamline { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-radius:14px; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.06); font-size:21px; }
  .wait { color:var(--amber); font-weight:900; letter-spacing:.12em; }
  .signal { color:var(--green); font-weight:900; }

  .sequence { display:flex; justify-content:center; gap:clamp(8px,1.5cqw,16px); margin-top:28px; max-width:100%; }
  .orb { width:clamp(62px,9.5cqw,104px); height:clamp(62px,9.5cqw,104px); border-radius:50%; display:grid; place-items:center; font-size:24px; font-weight:900; letter-spacing:.08em; border:4px solid rgba(255,255,255,.08); box-shadow:0 0 40px rgba(255,255,255,.05); }
  .orb.redbg { background:radial-gradient(circle at 35% 30%, #ff7b86, #8d1e29 65%, #401018); color:white; }
  .orb.blackbg { background:radial-gradient(circle at 35% 30%, #59616f, #12151b 65%, #06070a); color:white; }
  .betarrow { margin-top:24px; font-size:28px; color:var(--muted); }
  .chip-bet { margin:28px auto 0; width:142px; height:142px; border-radius:50%; display:grid; place-items:center; border:9px dotted rgba(255,255,255,.75); background:radial-gradient(circle, #f6f7f9 0 38%, #a7abb1 39% 48%, #5a5f66 49% 100%); color:#111; font-weight:900; font-size:24px; box-shadow:0 16px 38px rgba(0,0,0,.35); }

  .double { display:flex; gap:18px; align-items:center; justify-content:center; margin-top:26px; }
  .moneybox { width:170px; padding:24px 18px; text-align:center; font-size:62px; font-weight:900; border-radius:22px; }
  .losebox { padding:10px 16px; border-radius:999px; background:rgba(255,90,103,.10); color:var(--red); font-weight:800; letter-spacing:.12em; }

  .result-list { width:88%; margin:26px auto 0; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .result-item { padding:17px 18px; border:1px solid rgba(105,232,140,.23); background:rgba(105,232,140,.045); border-radius:16px; display:flex; justify-content:space-between; align-items:center; font-size:18px; }
  .result-item b { color:var(--green); font-size:22px; }

  .rise-chart { width:90%; height:280px; margin:22px auto 0; border:1px solid var(--line); border-radius:22px; background:linear-gradient(180deg, rgba(105,232,140,.05), rgba(255,255,255,.01)); position:relative; overflow:hidden; }
  .rise-chart svg { width:100%; height:100%; display:block; }
  .profit-pills { display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
  .profit { padding:11px 16px; border-radius:999px; border:1px solid rgba(105,232,140,.22); background:rgba(105,232,140,.06); color:var(--green); font-weight:800; }

  .victory { width:90%; margin:0 auto; text-align:center; }
  .victory .dial { opacity:.35; scale:1.15; margin-bottom:-80px; }
  .victory h1 { position:relative; margin:0 auto; font-size:clamp(66px,14.2cqw,154px); letter-spacing:-.06em; line-height:.88; font-weight:950; max-width:92%; white-space:nowrap; }
  .victory .sub { position:relative; margin-top:30px; font-size:clamp(22px,3.6cqw,38px); letter-spacing:.15em; text-transform:uppercase; color:var(--green); font-weight:900; }

  .stress { width:92%; margin:0 auto; text-align:center; }
  .stressbox { margin-top:28px; padding:24px; border:1px solid rgba(255,200,87,.22); background:rgba(255,200,87,.045); border-radius:22px; }
  .stressbox .from { color:var(--muted); text-decoration:line-through; }
  .stressbox .to { font-size:clamp(48px,7.4cqw,80px); font-weight:950; letter-spacing:-.045em; color:var(--amber); text-shadow:0 0 34px rgba(255,200,87,.22); white-space:nowrap; }

  .matrix { width:92%; height:390px; margin:24px auto 0; display:grid; grid-template-columns:repeat(25,1fr); gap:4px; }
  .cell { border-radius:4px; background:rgba(105,232,140,.24); border:1px solid rgba(105,232,140,.08); }
  .cell.l { background:rgba(255,90,103,.55); border-color:rgba(255,90,103,.18); }
  .matrix.dark .cell { background:rgba(255,90,103,.66); }

  .shock { width:90%; margin:0 auto; text-align:center; }
  .shocknum { font-size:clamp(76px,20cqw,218px); line-height:.78; font-weight:950; letter-spacing:-.07em; color:var(--red); text-shadow:0 0 46px rgba(255,90,103,.18); max-width:100%; white-space:nowrap; }
  .shocklabel { margin-top:24px; font-size:clamp(22px,3.8cqw,40px); font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
  .smallbar { width:84%; height:18px; margin:30px auto 0; border-radius:999px; background:rgba(255,255,255,.05); overflow:hidden; display:flex; }
  .smallbar .loss { width:81.8%; background:linear-gradient(90deg, rgba(255,90,103,.75), rgba(255,90,103,.45)); }
  .smallbar .win { width:18.2%; background:linear-gradient(90deg, rgba(105,232,140,.8), rgba(105,232,140,.4)); }

  .bankrupt { width:88%; margin:0 auto; }
  .bank-head { display:flex; justify-content:space-between; color:var(--muted); letter-spacing:.16em; text-transform:uppercase; font-size:18px; }
  .bank { text-align:center; margin:18px 0 10px; font-size:clamp(58px,11cqw,118px); font-weight:950; line-height:.86; letter-spacing:-.08em; white-space:nowrap; }
  .bankline { height:8px; background:rgba(255,255,255,.06); border-radius:999px; overflow:hidden; }
  .bankline > div { height:100%; width:100%; background:linear-gradient(90deg, #69e88c, #ffc857, #ff5a67); transform-origin:left center; }
  .zero { text-align:center; margin-top:44px; font-size:clamp(46px,7cqw,72px); font-weight:950; color:var(--red); white-space:nowrap; }
  .wipe { text-align:center; margin-top:13px; font-size:clamp(18px,2.7cqw,27px); letter-spacing:.17em; text-transform:uppercase; color:var(--red); font-weight:900; }
  .wipe-note { text-align:center; color:var(--muted); margin-top:18px; font-size:18px; }

  .donut { width:340px; height:340px; border-radius:50%; margin:0 auto 32px; position:relative; background:conic-gradient(var(--green) 0 18.2%, rgba(255,90,103,.15) 18.2% 100%); display:grid; place-items:center; box-shadow:0 0 55px rgba(105,232,140,.12); }
  .donut::after { content:""; width:208px; height:208px; border-radius:50%; background:#080b10; border:1px solid rgba(255,255,255,.06); }
  .donutlabel { position:absolute; z-index:1; text-align:center; }
  .donutlabel .pct { font-size:clamp(52px,8.5cqw,92px); font-weight:950; letter-spacing:-.08em; line-height:.9; white-space:nowrap; }
  .donutlabel .smalltxt { margin-top:8px; font-size:18px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; }

  .years { width:88%; margin:0 auto; }
  .flow { display:flex; flex-direction:column; gap:12px; }
  .flowbox { padding:22px 24px; border:1px solid var(--line); border-radius:20px; background:rgba(255,255,255,.035); display:flex; justify-content:space-between; align-items:center; }
  .flowbox .left { font-size:24px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
  .flowbox .right { font-size:clamp(28px,5.2cqw,56px); font-weight:900; letter-spacing:-.05em; white-space:nowrap; }
  .flowarrow { text-align:center; color:var(--muted); font-size:28px; }
  .calendar { width:76%; height:160px; margin:0 auto 22px; border-radius:20px; border:1px solid var(--line); background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); position:relative; overflow:hidden; }
  .caltop { height:40px; display:flex; align-items:center; padding:0 18px; background:rgba(255,255,255,.05); letter-spacing:.12em; text-transform:uppercase; font-size:15px; color:var(--muted); }
  .calgrid { position:absolute; inset:52px 18px 16px; display:grid; grid-template-columns:repeat(7,1fr); gap:7px; opacity:.65; }
  .calday { border:1px solid rgba(255,255,255,.08); border-radius:6px; }

  .blackout { position:absolute; inset:0; display:grid; place-items:center; background:#000; }
  .cliff { text-align:center; }
  .cliff .ep { font-size:24px; letter-spacing:.35em; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
  .cliff h1 { font-size:clamp(40px,8.4cqw,90px); margin:0; line-height:.88; letter-spacing:-.06em; font-weight:950; max-width:100%; overflow-wrap:anywhere; }
  .cliff .tease { margin-top:22px; font-size:clamp(15px,2.3cqw,25px); letter-spacing:.12em; text-transform:uppercase; color:var(--cyan); font-weight:850; }

  #subtitles { position:absolute; left:7%; right:7%; bottom:7.5%; z-index:90; display:flex; justify-content:center; pointer-events:none; }
  #subtitleText { width:100%; max-width:92%; text-align:center; padding:clamp(10px,1.5cqw,16px) clamp(12px,2cqw,22px); border-radius:16px; background:rgba(0,0,0,.68); box-shadow:0 8px 28px rgba(0,0,0,.24); font-size:clamp(18px,3.4cqw,36px); font-weight:850; line-height:1.12; letter-spacing:-.02em; text-shadow:0 2px 8px rgba(0,0,0,.8); backdrop-filter:blur(5px); overflow-wrap:anywhere; }

  /* Screen-recording controls are intentionally hidden. Use click gestures on the frame instead. */
  #controls { display:none !important; }
  #stage { cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  @container (max-width: 520px) {
    .exp-grid { grid-template-columns:1fr; gap:12px; }
    .exp-grid .arrow { transform:rotate(90deg); }
    .result-list { grid-template-columns:1fr; }
    .testgrid { grid-template-columns:repeat(2,1fr); }
    .matrix { grid-template-columns:repeat(15,1fr); gap:3px; }
    .topbar { left:0; right:0; top:0; min-height:70px; padding:18px 18px 12px; font-size:10px; }
    #content { top:74px; }
    .simtag { padding:6px 9px; }
    .eyebrow { gap:8px; }
    #subtitles { bottom:6%; }
  }

  .hidden { display:none !important; }
  .fadeIn { animation:fadeIn .55s ease both; }
  .pop { animation:pop .55s cubic-bezier(.2,.9,.2,1.2) both; }
  .slam { animation:slam .7s cubic-bezier(.12,.85,.14,1) both; }
  .glitch { animation:glitch .3s steps(2,end) both; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none} }
  @keyframes pop { from{opacity:0; transform:scale(.65)} to{opacity:1; transform:scale(1)} }
  @keyframes slam { 0%{opacity:0; transform:scale(1.5)} 70%{opacity:1; transform:scale(.97)} 100%{opacity:1; transform:scale(1)} }
  @keyframes glitch { 0%{transform:translate(0)} 25%{transform:translate(-6px,2px)} 50%{transform:translate(5px,-1px)} 75%{transform:translate(-3px,-2px)} 100%{transform:translate(0)} }

  @media (max-height: 900px) {
    .label { font-size:clamp(12px,1.8cqw,16px); }
    .topbar { left:0; right:0; top:0; min-height:78px; padding:22px 26px 14px; font-size:12px; }
    #content { top:82px; }
    #subtitles { left:28px; right:28px; bottom:7%; }
    #subtitleText { font-size:clamp(18px,3cqw,26px); padding:10px 14px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="shake">
    <div id="grid"></div>
    <div id="content"></div>
    <div id="subtitles"><div id="subtitleText"></div></div>
  </div>
  <div id="particles"></div>
  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="fx"><div id="flash"></div></div>
  <div class="topbar">
    <div class="eyebrow"><span class="dot"></span><span>CAN AI BEAT ROULETTE?</span></div>
    <div class="simtag">SIMULATION</div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const scenes = [
    {s:0,e:3,  sub:'In the last episode, AI finished profitable in', key:'callback'},
    {s:3,e:5,  sub:'8 out of 10 tests,', key:'eight'},
    {s:5,e:7,  sub:'but those were only 100 spins.', key:'hundred'},
    {s:7,e:10, sub:'So I asked, what happens if we play longer?', key:'longer'},
    {s:10,e:12,sub:'Same $10,000 bankroll, but now', key:'setup'},
    {s:12,e:13,sub:'1,000 spins.', key:'thousand'},
    {s:13,e:15,sub:'The first result was down.', key:'firstloss'},
    {s:15,e:18,sub:'I thought maybe it was just bad luck, so I ran 10 more tests,', key:'tenmore'},
    {s:18,e:20,sub:'and 8 out of 10 lost money.', key:'eightlost'},
    {s:20,e:22,sub:'So AI suggested something different.', key:'newai'},
    {s:22,e:24,sub:"Don't bet every spin.", key:'nobet'},
    {s:24,e:27,sub:'Wait until the same color appears 3 times in a row, like red, red, red,', key:'trigger'},
    {s:27,e:29,sub:'then bet black.', key:'betblack'},
    {s:29,e:30,sub:'If we lose, double the bet.', key:'double'},
    {s:30,e:34,sub:'I tested 10 sessions of 1,000 spins, and somehow,', key:'tenwins'},
    {s:34,e:36,sub:'all 10 finished profitable.', key:'tenof10'},
    {s:36,e:38,sub:'A few thousand dollar profit each round.', key:'thousands'},
    {s:38,e:40,sub:'I thought I had finally found a way to win.', key:'victory'},
    {s:40,e:43,sub:'Then, my AI agent made the test much harder.', key:'stress'},
    {s:43,e:44,sub:'100,000 spins', key:'100k'},
    {s:44,e:46,sub:'across 1,000 simulations.', key:'1000sim'},
    {s:46,e:50,sub:'This time, 818 simulations lost money,', key:'818'},
    {s:50,e:54,sub:'and all 818 wiped out the $10,000 bankroll.', key:'wipe'},
    {s:54,e:56,sub:'Only 18.2% finished profitable.', key:'182'},
    {s:56,e:59,sub:"At 100 spins a day, that's roughly 3 years of spins.", key:'threeyears'},
    {s:59,e:60,sub:'I needed another strategy.', key:'drawing'},
    {s:60,e:62,sub:'And AI had an idea.', key:'cliff'},
  ];

  const stage = document.getElementById('stage');
  const content = document.getElementById('content');
  const subtitleText = document.getElementById('subtitleText');
  const flash = document.getElementById('flash');
  let playing = true;
  let base = performance.now();
  let lastT = -1;
  let currentIndex = -1;
  let rafId = null;

  const sceneEls = new Map();

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function makeScenes() {
    const map = {
      callback: `
        <div class="center">
          <div class="dial wheelspin" style="width:250px;height:250px;margin-bottom:34px;opacity:.9"></div>
          <div class="row fadeIn"><div class="title">AI</div><div class="mid">+</div><div class="title">ROULETTE</div></div>
          <div class="mega cyan pop" style="margin-top:24px;max-width:82%;font-size:12.2cqw">$10,000</div>
          <div class="pillrow"><div class="pill">EP. 1</div><div class="pill">SHORT TEST</div></div>
        </div>`,
      eight: `
        <div class="center">
          <div class="huge slam">8 / 10</div>
          <div class="title green pop" style="margin-top:26px">PROFITABLE</div>
        </div>`,
      hundred: `
        <div class="center">
          <div class="label">EPISODE 1 DATA</div>
          <div class="mega amber slam" style="margin-top:30px">100</div>
          <div class="title" style="margin-top:14px">SPINS</div>
          <div class="pillrow"><div class="pill">THAT'S NOT MUCH DATA</div></div>
        </div>`,
      longer: `
        <div class="center">
          <div class="huge muted" id="longerCount">100</div>
          <div class="arrow">↓</div>
          <div class="mega cyan" id="longerTarget">1,000</div>
          <div class="title" style="margin-top:10px">SPINS</div>
          <div class="pillrow"><div class="pill">LONGER TEST</div></div>
        </div>`,
      setup: `
        <div class="center">
          <div class="experiment card">
            <div class="label" style="margin-bottom:22px">EXPERIMENT SETUP</div>
            <div class="exp-grid">
              <div class="metric"><div class="caption">STARTING BANKROLL</div><div class="value cyan">$10,000</div></div>
              <div class="arrow">→</div>
              <div class="metric"><div class="caption">SPINS</div><div class="value">100 → 1,000</div></div>
            </div>
          </div>
          <div class="small" style="margin-top:26px">same bankroll · 10 sessions</div>
        </div>`,
      thousand: `
        <div class="center">
          <div class="dial wheelspin" style="width:280px;height:280px;margin-bottom:20px"></div>
          <div class="mega cyan slam">1,000</div>
          <div class="title">SPINS</div>
          <div class="small" style="margin-top:18px"><span id="spinCounter">0000</span> / 1000</div>
        </div>`,
      firstloss: `
        <div class="center">
          <div class="label">TEST #1</div>
          <div class="lossbox card" style="margin-top:20px">
            <div class="lossline"><span class="label">START</span><span class="lossnum">$10,000</span></div>
            <div class="lossline"><span class="label">FINAL</span><span class="lossnum red">-$3,840</span></div>
            <div class="strike"></div>
          </div>
          <div class="title red slam" style="margin-top:28px">LOSS</div>
          <div class="small" style="margin-top:12px">ILLUSTRATIVE LOSS DISPLAY</div>
        </div>`,
      tenmore: `
        <div class="center">
          <div class="title">WAS IT JUST BAD LUCK?</div>
          <div class="label" style="margin-top:24px">RUNNING 10 MORE TESTS...</div>
          <div class="testgrid" id="testgrid"></div>
        </div>`,
      eightlost: `
        <div class="center">
          <div class="label">10 LONG TESTS</div>
          <div class="mega red slam">8 / 10</div>
          <div class="title red" style="margin-top:10px">LOST MONEY</div>
          <div class="small" style="margin-top:22px">2 / 10 PROFITABLE</div>
        </div>`,
      newai: `
        <div class="center">
          <div class="ai-box card">
            <div class="ai-head"><div class="ai-chip">AI STRATEGY ANALYSIS</div><div class="label">LIVE</div></div>
            <div class="stream"><div class="streamline"><span>OLD APPROACH</span><span class="muted">BET EVERY SPIN</span></div><div class="streamline"><span>NEW APPROACH</span><span class="signal">DETECTED</span></div></div>
          </div>
          <div class="title cyan slam" style="margin-top:30px">NEW APPROACH DETECTED</div>
        </div>`,
      nobet: `
        <div class="center">
          <div class="label">ROULETTE STREAM</div>
          <div class="stream" id="nobetStream" style="width:84%;margin:28px auto 0"></div>
          <div class="mega amber slam" style="margin-top:26px;max-width:82%;font-size:11.8cqw">WAIT</div>
        </div>`,
      trigger: `
        <div class="center">
          <div class="label">TRIGGER CONDITION</div>
          <div class="sequence" id="redSequence"><div class="orb redbg">RED</div><div class="orb redbg">RED</div><div class="orb redbg">RED</div></div>
          <div class="mega cyan slam" style="margin-top:30px;max-width:88%;font-size:10.8cqw;letter-spacing:-.03em">3 IN A ROW</div>
        </div>`,
      betblack: `
        <div class="center">
          <div class="label">THREE REDS DETECTED</div>
          <div class="sequence"><div class="orb redbg">RED</div><div class="orb redbg">RED</div><div class="orb redbg">RED</div></div>
          <div class="title" style="margin-top:26px">→ BET</div>
          <div class="chip-bet">BLACK</div>
        </div>`,
      double: `
        <div class="center">
          <div class="label">NEXT STEP</div>
          <div class="double"><div class="moneybox card">$10</div><div class="losebox">LOSE</div><div class="arrow">→</div><div class="moneybox card" style="color:var(--amber)">$20</div></div>
          <div class="pillrow"><div class="pill">MARTINGALE</div></div>
        </div>`,
      tenwins: `
        <div class="center">
          <div class="title">10 SESSIONS</div>
          <div class="label" style="margin-top:10px">1,000 SPINS EACH</div>
          <div class="result-list" id="resultList"></div>
          <div class="small" style="margin-top:18px">SIMULATED RESULT DISPLAY</div>
        </div>`,
      tenof10: `
        <div class="victory"><div class="dial wheelspin"></div><h1 class="green slam">10 / 10</h1><div class="sub">PROFITABLE</div></div>`,
      thousands: `
        <div class="center">
          <div class="label">SESSION PROFITS</div>
          <div class="profit-pills"><div class="profit">+$1,800</div><div class="profit">+$2,400</div><div class="profit">+$3,100</div><div class="profit">+$2,700</div></div>
          <div class="rise-chart"><svg viewBox="0 0 900 280" preserveAspectRatio="none"><defs><linearGradient id="fillRise" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#69e88c" stop-opacity=".32"/><stop offset="1" stop-color="#69e88c" stop-opacity="0"/></linearGradient></defs><path d="M0,230 C120,220 190,180 280,190 C380,160 420,125 520,140 C610,110 690,70 790,80 C840,70 870,52 900,48 L900,280 L0,280 Z" fill="url(#fillRise)"/><path d="M0,230 C120,220 190,180 280,190 C380,160 420,125 520,140 C610,110 690,70 790,80 C840,70 870,52 900,48" fill="none" stroke="#69e88c" stroke-width="6" vector-effect="non-scaling-stroke"/></svg></div>
          <div class="title green" style="margin-top:24px">+$2K-ISH</div>
        </div>`,
      victory: `
        <div class="center"><div class="title" style="margin-bottom:20px">DID I FIND IT?</div><div class="rise-chart" style="height:330px"><svg viewBox="0 0 900 330" preserveAspectRatio="none"><path d="M0,300 L0,260 L170,220 L350,160 L520,120 L700,70 L900,40 L900,330 L0,330 Z" fill="rgba(105,232,140,.08)"/><path d="M0,260 L170,220 L350,160 L520,120 L700,70 L900,40" fill="none" stroke="#69e88c" stroke-width="7" vector-effect="non-scaling-stroke"/></svg><div style="position:absolute;left:26px;bottom:20px;font-size:24px;color:var(--muted)">$10,000</div><div style="position:absolute;right:26px;top:16px;font-size:28px;color:var(--green);font-weight:900">$14,000</div></div><div class="small" style="margin-top:14px">THE BREAKTHROUGH LOOKED REAL</div></div>`,
      stress: `
        <div class="stress"><div class="mega" style="font-size:12.5cqw;max-width:88%">WAIT.</div><div class="stressbox"><div class="label">STRESS TEST</div><div class="from" style="font-size:44px;margin-top:20px">1,000 SPINS</div><div style="font-size:42px;color:var(--muted);margin:8px 0">↓</div><div class="to">100,000 SPINS</div></div></div>`,
      '100k': `
        <div class="center"><div class="mega amber slam" style="font-size:11.6cqw;max-width:90%">100,000</div><div class="title">SPINS</div><div class="small" style="margin-top:24px">LONG-RUN STRESS TEST</div><div class="dial wheelspin" style="margin-top:28px;width:180px;height:180px;opacity:.6"></div></div>`,
      '1000sim': `
        <div class="center"><div class="mega">1,000</div><div class="title">SIMULATIONS</div><div class="matrix" id="matrix"></div></div>`,
      '818': `
        <div class="shock"><div class="label">1,000 SIMULATIONS</div><div class="shocknum slam">818</div><div class="shocklabel red">LOST MONEY</div><div class="smallbar"><div class="loss"></div><div class="win"></div></div><div class="row" style="margin-top:16px;justify-content:space-between;width:84%;margin-left:auto;margin-right:auto"><span class="red" style="font-weight:900">818 LOST</span><span class="green" style="font-weight:900">182 PROFITABLE</span></div></div>`,
      wipe: `
        <div class="bankrupt" id="bankrupt">
          <div class="bank-head"><span>818 LOSING SIMULATIONS</span><span>STARTING BANKROLL</span></div>
          <div class="bank" id="bankValue">$10,000</div>
          <div class="bankline"><div id="bankFill"></div></div>
          <div class="zero">$0</div>
          <div class="wipe">BANKROLL WIPED OUT</div>
          <div class="wipe-note">applies to the 818 losing simulations</div>
        </div>`,
      '182': `
        <div class="center"><div class="donut"><div class="donutlabel"><div class="pct">18.2%</div><div class="smalltxt">finished profitable</div></div></div><div class="row"><div class="title red">81.8%</div><div class="label">LOSS</div></div></div>`,
      threeyears: `
        <div class="years"><div class="calendar"><div class="caltop">SIMPLIFIED SPIN CALENDAR</div><div class="calgrid" id="calgrid"></div></div><div class="flow"><div class="flowbox"><div class="left">per day</div><div class="right">100 SPINS</div></div><div class="flowarrow">↓</div><div class="flowbox"><div class="left">per year</div><div class="right">36,500</div></div><div class="flowarrow">↓</div><div class="flowbox"><div class="left">3 years</div><div class="right">~109,500</div></div></div></div>`,
      drawing: `
        <div class="blackout"><div class="cliff"><div class="ep">EPISODE 2</div><h1>BACK TO<br>THE DRAWING<br>BOARD</h1><div class="tease">NEW STRATEGY?</div></div></div>`,
      cliff: `
        <div class="blackout"><div class="cliff"><div class="ep">EPISODE 3</div><h1>AI INVENTED<br>SOMETHING<br>DIFFERENT</h1><div class="tease">100-SPIN NUMBER STRATEGY</div></div></div>`
    };

    scenes.forEach((s, i) => {
      const node = el(`<section class="scene" data-key="${s.key}">${map[s.key]}</section>`);
      content.appendChild(node);
      sceneEls.set(s.key, node);
    });

    // dynamic grids / deterministic visual seeds
    const testgrid = sceneEls.get('tenmore').querySelector('#testgrid');
    for (let i=1;i<=10;i++) testgrid.appendChild(el(`<div class="testcell" data-i="${i}">TEST ${String(i).padStart(2,'0')}</div>`));

    const nobetStream = sceneEls.get('nobet').querySelector('#nobetStream');
    const sequence = ['RED','BLACK','RED','BLACK','RED','BLACK','RED','BLACK'];
    sequence.forEach((r, i) => nobetStream.appendChild(el(`<div class="streamline" data-i="${i}"><span>${r}</span><span class="wait">NO BET</span></div>`)));

    const results = [1840,2130,1470,2760,1920,2340,1610,2520,1780,2210];
    const resultList = sceneEls.get('tenwins').querySelector('#resultList');
    results.forEach((n,i)=>resultList.appendChild(el(`<div class="result-item" data-i="${i}"><span>TEST ${String(i+1).padStart(2,'0')}</span><b>+$${n.toLocaleString()}</b></div>`)));

    const matrix = sceneEls.get('1000sim').querySelector('#matrix');
    for (let i=0;i<175;i++) matrix.appendChild(el(`<div class="cell" data-i="${i}"></div>`));

    const calgrid = sceneEls.get('threeyears').querySelector('#calgrid');
    for (let i=0;i<35;i++) calgrid.appendChild(el('<div class="calday"></div>'));
  }

  function activate(index) {
    if (index === currentIndex) return;
    currentIndex = index;
    const s = scenes[index];
    for (const [key,node] of sceneEls) node.classList.toggle('active', key === s.key);
    const activeNode = sceneEls.get(s.key);
    activeNode.querySelectorAll('.fadeIn,.pop,.slam,.glitch').forEach(node => {
      const classes = ['fadeIn','pop','slam','glitch'].filter(c => node.classList.contains(c));
      classes.forEach(c => node.classList.remove(c));
      void node.offsetWidth;
      classes.forEach(c => node.classList.add(c));
    });
    subtitleText.textContent = s.sub;
    subtitleText.style.visibility = 'visible';
    applySceneEnter(s.key);
  }

  function applySceneEnter(key) {
    // exact deterministic resets; no randomness.
    if (key === 'tenmore') {
      sceneEls.get('tenmore').querySelectorAll('.testcell').forEach(c => c.classList.remove('loss','win'));
    }
    if (key === 'nobet') {
      sceneEls.get('nobet').querySelectorAll('.streamline').forEach((r) => { r.style.opacity = '.25'; });
    }
    if (key === 'tenwins') {
      sceneEls.get('tenwins').querySelectorAll('.result-item').forEach(r => { r.style.opacity = '.15'; transformNone(r); });
    }
    if (key === '1000sim') {
      sceneEls.get('1000sim').querySelector('#matrix').classList.remove('dark');
      sceneEls.get('1000sim').querySelectorAll('.cell').forEach((c,i) => c.classList.toggle('l', (i % 17 === 0 || i % 29 === 0)));
    }
    if (key === 'wipe') {
      const b = sceneEls.get('wipe');
      b.querySelector('#bankValue').textContent = '$10,000';
      b.querySelector('#bankFill').style.transform = 'scaleX(1)';
    }
  }

  function transformNone(el){ el.style.transform='none'; }

  function localTime(t, s) { return Math.max(0, Math.min(s.e-s.s, t-s.s)); }

  function updateVisuals(t) {
    const s = scenes[currentIndex];
    const lt = localTime(t, s);
    const activeNode = sceneEls.get(s.key);
    activeNode.querySelectorAll('.wheelspin').forEach((w,i) => {
      const speed = s.key === 'victory' ? 70 : 410;
      w.style.setProperty('--spin-angle', `${((t * speed) + i * 37) % 360}deg`);
    });
    switch (s.key) {
      case 'longer': {
        const p = Math.min(1, lt / 3);
        const n = Math.round(100 + 900 * easeInOut(p));
        sceneEls.get('longer').querySelector('#longerCount').textContent = String(Math.round(100 + 900 * (1-p))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        sceneEls.get('longer').querySelector('#longerTarget').textContent = n.toLocaleString();
        break;
      }
      case 'thousand': {
        const p = Math.min(1, lt / 1);
        const n = Math.min(1000, Math.round(1000 * easeOutCubic(p)));
        sceneEls.get('thousand').querySelector('#spinCounter').textContent = String(n).padStart(4,'0');
        break;
      }
      case 'tenmore': {
        const on = Math.min(10, Math.floor((lt / 3) * 11));
        sceneEls.get('tenmore').querySelectorAll('.testcell').forEach((c,i) => { c.classList.toggle('loss', i < Math.min(8,on)); c.classList.toggle('win', i >= Math.max(8,on) && i < on); });
        break;
      }
      case 'nobet': {
        const i = Math.min(7, Math.floor((lt / 2) * 8));
        sceneEls.get('nobet').querySelectorAll('.streamline').forEach((r,j)=> r.style.opacity = j <= i ? '.9' : '.25');
        break;
      }
      case 'trigger': {
        const p = Math.min(1, lt/3);
        sceneEls.get('trigger').querySelectorAll('.orb').forEach((o,i)=> o.style.transform=`translateY(${i <= Math.floor(p*3)*2 ? 0 : 26}px) scale(${i <= Math.floor(p*3)-1 ? 1 : .82})`);
        break;
      }
      case 'tenwins': {
        const on = Math.min(10, Math.floor((lt / 4) * 12));
        sceneEls.get('tenwins').querySelectorAll('.result-item').forEach((r,i)=>r.style.opacity = i < on ? '1' : '.14');
        break;
      }
      case '1000sim': {
        const p = Math.min(1, lt/2);
        const cells = sceneEls.get('1000sim').querySelectorAll('.cell');
        cells.forEach((c,i)=> { const threshold = ((i*37)%101)/100; c.classList.toggle('l', threshold < 0.26 + p*0.5); });
        break;
      }
      case 'wipe': {
        const p = Math.min(1, lt/4);
        const val = 10000 * (1 - easeInOut(p));
        const displayed = val > 500 ? `$${(Math.round(val/100)*100).toLocaleString()}` : val > 50 ? `$${Math.round(val/10)*10}` : '$0';
        sceneEls.get('wipe').querySelector('#bankValue').textContent = displayed.replace('NaN','0');
        sceneEls.get('wipe').querySelector('#bankFill').style.transform = `scaleX(${Math.max(0,1-p)})`;
        break;
      }
      case 'threeyears': {
        const cells = sceneEls.get('threeyears').querySelectorAll('.calday');
        const p = Math.min(1, lt/3);
        cells.forEach((c,i)=>c.style.opacity = i < Math.floor(p*35) ? '.95' : '.25');
        break;
      }
    }

    // cue-specific dramatic flash / shake without non-deterministic randomness
    if (s.key === '818' && lt > .02 && lt < .10) flash.style.opacity = String(0.85 * (1 - lt/.10));
    else if (s.key !== 'wipe') flash.style.opacity = '0';
    if (s.key === 'wipe' && lt < .35) {
      stage.style.transform = `translate(${Math.sin(lt*72)*4}px, ${Math.cos(lt*69)*3}px)`;
    } else {
      stage.style.transform = '';
    }
  }

  function easeInOut(x){ return x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2; }
  function easeOutCubic(x){ return 1-Math.pow(1-x,3); }

  function frame(now) {
    if (!playing) { rafId = requestAnimationFrame(frame); return; }
    const elapsed = (now - base) / 1000;
    const t = elapsed % 62;
    if (t < lastT) { currentIndex = -1; }
    lastT = t;
    let idx = scenes.findIndex(s => t >= s.s && t < s.e);
    if (idx === -1) idx = scenes.length - 1;
    activate(idx);
    updateVisuals(t);
    rafId = requestAnimationFrame(frame);
  }

  // Screen-recording controls: single click/tap toggles play/pause; double click/tap restarts.
  // A short debounce prevents the first click of a double-click from toggling playback.
  let clickTimer = null;
  function restartPlayback() {
    base = performance.now();
    currentIndex = -1;
    lastT = -1;
    playing = true;
  }
  function togglePlayback() {
    if (playing) {
      playing = false;
    } else {
      const resumeT = lastT < 0 ? 0 : lastT;
      base = performance.now() - (resumeT * 1000);
      playing = true;
    }
  }
  stage.addEventListener('click', () => {
    if (clickTimer) return;
    clickTimer = window.setTimeout(() => {
      clickTimer = null;
      togglePlayback();
    }, 220);
  });
  stage.addEventListener('dblclick', (event) => {
    event.preventDefault();
    if (clickTimer) {
      window.clearTimeout(clickTimer);
      clickTimer = null;
    }
    restartPlayback();
  });

  // Touchscreens do not always emit dblclick consistently, so detect a close second tap too.
  let lastTap = 0;
  stage.addEventListener('pointerup', (event) => {
    if (event.pointerType !== 'touch') return;
    const now = performance.now();
    if (now - lastTap < 320) {
      if (clickTimer) {
        window.clearTimeout(clickTimer);
        clickTimer = null;
      }
      restartPlayback();
    }
    lastTap = now;
  });

  // Build once, then begin at t=0 deterministically.
  makeScenes();
  requestAnimationFrame(frame);
})();
</script>
</body>
