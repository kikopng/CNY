function overlays(t){
 if(t>=13.4&&t<17.8){dim(.6);[['RULE 1: NO DISMANTLING',590,13.4],['RULE 2: WHOLE CARS ONLY',790,15.55]].forEach(([s,y,t0])=>{if(t<t0)return;const p=ease(prog(t,t0,t0+.25));

  for(let i=0;i<12;i++){const b=bay(i),a=.5+.5*Math.sin(t*10+i);c.save();c.globalAlpha=.35+.5*a;c.fillStyle='#ff2a2a';c.beginPath();c.arc(b.x+b.w-28,b.y+28,18,0,7);c.fill();txt('!',b.x+b.w-28,b.y+29,24,'#fff');c.restore()}

  let n=t<27.7?'?':t<28.45?'3':t<29.2?'2':'1',st=t<27.7?25:t<28.45?27.7:t<29.2?28.45:29.2;const pl=1+.18*(1-prog(t,st,st+.4));

  const bp=1+.05*Math.sin(t*8);c.save();c.translate(540,460);c.scale(bp,bp);c.fillStyle='#ffd700';rr(-210,-40,420,80,40);c.fill();txt('PAUSE & SOLVE',0,2,36,'#111');c.restore()}
 if(t>=48&&t<51.5){dim(.88);const n=Math.floor(prog(t,48.2,50)*11)+(t>=48.2?1:0),cols=['#2d7dff','#2d7dff','#2d7dff','#2d7dff','#2d7dff','#2d7dff','#35ff9a','#35ff9a','#35ff9a','#ffd24a','#ffd24a'],sw=800/12;
  txt('6/12 + 3/12 + 2/12 = 11/12',540,560,38,'#fff',MONO);

   txt('▲ 1/12 VACANT',800,790,34,'#ff5050',MONO);txt('THE LOOPHOLE',540,880,56,'#ff5050')}}

  c.strokeStyle='#9fc3ff';c.lineWidth=12;c.lineCap='round';c.beginPath();c.moveTo(px,py);c.lineTo(px,930);c.stroke();c.fillStyle='#9fc3ff';rr(400,930,280,24,8);c.fill();
  c.save();c.translate(px,py);c.rotate(a);c.beginPath();c.moveTo(-L,0);c.lineTo(L,0);c.stroke();c.restore();
  [[-1,'LEGAL GENIUS','#00f0ff'],[1,'CONTRACT FRAUD','#ff4040']].forEach(([s,l,col])=>{const ex=px+s*L*Math.cos(a),ey=py+s*L*Math.sin(a);c.strokeStyle=col;c.lineWidth=4;c.beginPath();c.moveTo(ex,ey);c.lineTo(ex-100,ey+190);c.moveTo(ex,ey);c.lineTo(ex+100,ey+190);c.stroke();

function seek(t){cur=cl(t,0,DUR);if(hasAudio)audio.currentTime=cur+offset;vStart=performance.now()-cur*1000}

 seek(0)};
$('png').onclick=()=>{render(0,false);const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='frame0_thumbnail.png';a.click()};

 const ch=[];rec=new MediaRecorder(vs,mt?{mimeType:mt,videoBitsPerSecond:12e6}:{videoBitsPerSecond:12e6});
 rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 rec.onstop=()=>{const b=new Blob(ch,{type:mt||'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='supercar_paradox.'+(mt.includes('mp4')?'mp4':'webm');a.click();exporting=false;$('prog').style.display='none';$('pct').textContent='Done';rec=null};
 $('prog').style.display='block';seek(0);rec.start(250);play()};

function loop(){
 if(playing){cur=hasAudio?Math.max(0,audio.currentTime-offset):(performance.now()-vStart)/1000;
  if(cur>=DUR||(hasAudio&&audio.ended)){cur=Math.min(cur,DUR);pause();if(exporting&&rec)setTimeout(()=>rec&&rec.state!=='inactive'&&rec.stop(),400)}}
 render(cur,showSafe&&!exporting);
 $('seek').value=cur;$('tm').textContent=cur.toFixed(2)+' / '+DUR.toFixed(2);
 if(exporting){const p=Math.round(cur/DUR*100);$('bar').style.width=p+'%';$('pct').textContent='Exporting '+p+'%'}
 requestAnimationFrame(loop)}
render(0,false);loop();
</script></body></html>
