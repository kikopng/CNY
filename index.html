<script>

const E=x=>x<0?0:x>1?1:x,ez=x=>1-Math.pow(1-E(x),3),pr=(t,a,b)=>E((t-a)/(b-a)),ph=(l,a,b)=>E((l-a)/.6)*E((b-l)/.6);

function tx(s,x,y,z,col,o){o=o||{};col=col||W;c.save();c.globalAlpha*=o.a==null?1:o.a;c.font=(o.w||800)+' '+z+'px Inter,system-ui,Helvetica,Arial,sans-serif';c.textAlign=o.al||'center';c.textBaseline='middle';

function ln(a,x,y,w,h,col,p,lw,mn,mx){p=p==null?1:p;mn=mn==null?Math.min(...a):mn;mx=mx==null?Math.max(...a):mx;const k=Math.floor(a.length*p);c.beginPath();for(let i=0;i<k;i++){const px=x+i/(a.length-1)*w,py=y+h-(a[i]-mn)/((mx-mn)||1)*h;i?c.lineTo(px,py):c.moveTo(px,py)}c.strokeStyle=col;c.lineWidth=lw||5;c.lineJoin='round';c.stroke()}

 dot(0,0,r*.6,'#0d0f14',GO);dot(0,0,r*.12,GO);c.restore()}

 const s=f(n),a=s.a==null?1:s.a;c.save();c.globalAlpha*=a;c.beginPath();c.roundRect(x+3,y+3,cw-6,h-6,10);c.fillStyle=s.f;c.fill();c.strokeStyle=s.o||'rgba(255,255,255,.25)';c.lineWidth=s.o?4:1.5;c.stroke();c.restore();tx(n,x+cw/2,y+h/2,cw*.4,W,{a:a,w:700})}}
function bars(v,cx,by,mh,n,o){o=o||{};const w=o.w||110,g=o.g||24,mx=Math.max(...v),tot=v.length*(w+g)-g;v.forEach((x,i)=>{const p=ez(n-i);if(p<=0)return;const h=Math.max(30,x/mx*mh)*p,x0=cx-tot/2+i*(w+g);c.save();c.globalAlpha*=p;c.fillStyle=o.col?o.col(i):R;c.beginPath();c.roundRect(x0,by-h,w,h,10);c.fill();c.restore();tx('$'+fm(x),x0+w/2,by-h-30,o.z||34,W,{a:p})})}

 pan(x,y,w,80,{a:p,st:q[1]||undefined,g:q[1]?20:0});tx(q[0],x,y,z,q[1]||W,{a:p})})}

const WL=(()=>{const r=rnd(9);let v=0;const a=[0];for(let i=0;i<40;i++){v+=.8+r()*.8;a.push(v)}a.push(v-15,v-35,v-60);return a})();
function wl(p,x,y,w,h){const a=WL,mn=Math.min(...a),mx=Math.max(...a),k=Math.floor(a.length*p),f=i=>y+h-(a[i]-mn)/(mx-mn)*h;for(let i=1;i<k;i++){c.beginPath();c.moveTo(x+(i-1)/(a.length-1)*w,f(i-1));c.lineTo(x+i/(a.length-1)*w,f(i));c.strokeStyle=a[i]<a[i-1]-3?R:G;c.lineWidth=i>40?9:5;c.stroke()}}
