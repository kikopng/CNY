<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tokyo Rule Rush — Minna no Nihongo 15</title>
<style>
:root{--ink:#16223d;--paper:#fffaf0;--red:#ff4f64;--pink:#ff7ca8;--blue:#38bdf8;--navy:#20234c;--yellow:#ffd166;--mint:#45d6b0;--violet:#8b5cf6;--shadow:0 8px 0 #18203a,0 18px 40px #18203a44}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#4f46a5 0,transparent 29%),linear-gradient(135deg,#101332,#29306c);font-family:ui-rounded,"Nunito",system-ui,sans-serif;color:var(--ink);overflow-x:hidden}button{font:inherit;cursor:pointer}.game{max-width:1040px;margin:auto;padding:18px 16px 42px}.top{color:white;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-size:clamp(21px,4vw,34px);font-weight:1000;letter-spacing:-1px;text-shadow:3px 3px #142044}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#a5f3fc}.toggles{display:flex;gap:7px}.toggle{border:2px solid #ffffff66;background:#ffffff1e;color:#fff;border-radius:99px;padding:8px 10px;font-weight:800;font-size:12px}.toggle.on{background:var(--yellow);color:#3a2b00;border-color:#fff}.hud{background:#fffdf6;border-radius:20px;padding:12px 16px;box-shadow:0 5px 0 #0e1430;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:13px;align-items:center;margin-bottom:16px}.hudBlock{font-weight:900;font-size:13px}.hudNum{font-size:21px;color:var(--navy)}.timer{height:14px;background:#e6e7ee;border-radius:99px;overflow:hidden;margin-top:5px}.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--red));border-radius:inherit;transition:width .1s linear}.scene{position:relative;min-height:540px;background:var(--paper);border-radius:28px;padding:clamp(18px,4vw,38px);box-shadow:var(--shadow);overflow:hidden}.scene:before,.scene:after{content:"";position:absolute;border-radius:50%;opacity:.18;pointer-events:none}.scene:before{width:270px;height:270px;background:var(--pink);top:-120px;right:-70px}.scene:after{width:230px;height:230px;background:var(--blue);bottom:-130px;left:-60px}.mission{position:relative;z-index:1;text-align:center;animation:pop .35s ease}.chapter{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;padding:7px 13px;font-size:12px;font-weight:900;letter-spacing:.8px}.mission h1{font-size:clamp(28px,5vw,48px);line-height:1.05;margin:17px 0 8px;color:var(--navy)}.mission p{max-width:590px;margin:0 auto 20px;font-size:16px;line-height:1.45}.district{font-size:70px;filter:drop-shadow(4px 5px 0 #ffd166);margin:8px}.brief{position:relative;z-index:1;background:#fff;border:3px solid #e6e9f2;border-radius:22px;padding:18px;max-width:720px;margin:16px auto;text-align:left}.brief h2{margin:0 0 8px;color:var(--red);font-size:20px}.brief li{margin:7px 0}.play{border:0;border-radius:16px;background:var(--red);color:#fff;font-weight:1000;padding:16px 26px;font-size:17px;box-shadow:0 6px 0 #a82640;transition:transform .12s,box-shadow .12s}.play:hover{transform:translateY(-2px)}.play:active{transform:translateY(5px);box-shadow:0 1px 0 #a82640}.card{position:relative;z-index:1;max-width:760px;margin:auto;background:#fff;border-radius:24px;padding:clamp(17px,4vw,30px);box-shadow:0 10px 25px #24305c1c}.caseTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.type{font-size:12px;font-weight:1000;letter-spacing:1px;color:#fff;background:var(--violet);padding:6px 10px;border-radius:8px}.caseNo{font-weight:900;color:#7a8499}.setting{font-size:16px;color:#59637a;margin:18px 0 4px}.japanese{font-size:clamp(28px,6vw,45px);font-weight:1000;line-height:1.25;color:var(--navy);min-height:78px}.assist{min-height:28px;color:#64748b;font-size:15px}.meaning{font-weight:800;color:#cf3152;margin-top:8px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:20px}.choice{border:3px solid #dfe4ef;background:#fff;border-radius:16px;padding:14px 7px;font-weight:1000;color:var(--navy);min-height:76px;transition:.15s}.choice:hover{border-color:var(--blue);background:#effbff;transform:translateY(-3px)}.choice b{display:block;font-size:16px}.choice span{display:block;font-size:11px;margin-top:4px;color:#65708a;font-weight:700}.choice.permit:hover{border-color:var(--mint)}.choice.forbid:hover{border-color:var(--red)}.choice.status:hover{border-color:var(--violet)}.feedback{position:relative;z-index:2;max-width:760px;margin:17px auto 0;border-radius:18px;padding:14px 17px;display:none;font-weight:700;line-height:1.35;animation:pop .25s ease}.feedback.good{display:block;background:#d8fff2;border:2px solid #50d7ae;color:#075e4b}.feedback.bad{display:block;background:#ffe2e7;border:2px solid #ff8391;color:#8b1830}.next{display:none;margin:14px auto 0}.assembly{margin-top:18px}.slots{min-height:58px;padding:9px;border:3px dashed #bac4d8;border-radius:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f7f9ff}.slots.empty:after{content:'Tap the tiles in order';color:#8792a9;font-weight:800;font-size:14px}.tiles{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.tile{border:2px solid #cbd5e1;border-radius:10px;background:#f8fafc;padding:9px 12px;font-weight:900;color:#253454}.tile:hover{background:#e0f7ff;border-color:#38bdf8}.tile.used{opacity:.3;pointer-events:none}.assemblyActions{display:flex;gap:9px;margin-top:13px}.smallBtn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;background:#e9edf6;color:#26334e}.check{background:var(--navy);color:#fff}.boss{background:linear-gradient(135deg,#35245f,#7c3aed);color:#fff}.boss .japanese{color:#fff}.boss .assist{color:#dcd2ff}.boss .setting{color:#e9ddff}.boss .type{background:var(--yellow);color:#302100}.boss .choice{background:#ffffff14;border-color:#ffffff55;color:#fff}.boss .choice span{color:#ddd5ff}.boss .choice:hover{background:#ffffff2a;border-color:var(--yellow)}.stamp{position:absolute;inset:12%;display:grid;place-items:center;font-size:clamp(65px,15vw,130px);font-weight:1000;transform:rotate(-15deg);pointer-events:none;opacity:0;z-index:4}.stamp.show{animation:stamp .7s ease forwards}.stamp.ok{color:#14b88f;text-shadow:3px 3px #fff}.stamp.no{color:#ff3657;text-shadow:3px 3px #fff}.float{position:fixed;z-index:10;color:#fff;font-size:26px;font-weight:1000;text-shadow:2px 3px #1e1b4b;pointer-events:none;animation:float .85s ease forwards}.confetti{position:fixed;z-index:9;width:10px;height:14px;pointer-events:none;animation:fall 1.1s ease-out forwards}.end{text-align:center}.end h1{font-size:clamp(34px,7vw,62px);margin:6px 0;color:var(--navy)}.rank{font-size:90px;margin:5px}.scoreBox{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0}.scoreItem{background:#f3f5fb;border-radius:15px;padding:12px;font-weight:900}.scoreItem b{display:block;font-size:25px;color:var(--red)}.lesson{font-size:13px;background:#fff0c7;border-radius:13px;padding:12px;line-height:1.4;text-align:left}.shake{animation:shake .35s}.hidden{display:none!important}@keyframes pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}@keyframes stamp{30%{opacity:1;transform:scale(1.3) rotate(-15deg)}100%{opacity:0;transform:scale(1) rotate(-15deg)}}@keyframes float{to{opacity:0;transform:translateY(-75px) scale(1.3)}}@keyframes fall{to{opacity:0;transform:translateY(220px) rotate(520deg)}}@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}@media(max-width:570px){.hud{grid-template-columns:1fr 1fr}.hud .timeBlock{grid-column:1/-1;order:-1}.scene{min-height:550px;padding:18px 13px}.choices{grid-template-columns:1fr}.choice{min-height:58px}.choice b{display:inline}.choice span{display:inline;margin-left:5px}.scoreBox{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="game">
 <header class="top"><div class="brand">東京 RULE RUSH <small>MINNA NO NIHONGO • LESSON 15</small></div><div class="toggles"><button class="toggle" id="furi">ふりがな</button><button class="toggle" id="roma">ROMAJI</button><button class="toggle" id="sound">♫ SFX</button></div></header>
 <section class="hud"><div class="hudBlock">SCORE <div class="hudNum" id="score">0000</div></div><div class="hudBlock timeBlock">INSPECTION WINDOW <div class="timer"><i id="timebar"></i></div></div><div class="hudBlock" style="text-align:right">COMBO <div class="hudNum" id="combo">×0</div></div></section>
 <section class="scene" id="scene" aria-live="polite"></section>
</main>
<script>
const $=s=>document.querySelector(s),scene=$('#scene');let score=0,combo=0,index=0,furigana=false,romaji=false,soundOn=true,timer=null,timeLeft=100,locked=false,correct=0;
const cases=[
 {kind:'RULE CHECK',place:'⛩️ Shrine courtyard',jp:'ここで <ruby>写真<rt>しゃしん</rt></ruby>を <ruby>撮<rt>と</rt></ruby>ってもいいですか。',ro:'Koko de shashin o tottemo ii desu ka?',en:'A visitor asks: “May I take photos here?”',answer:'permit',ex:'Correct. <b>〜てもいいですか</b> asks permission: “May I...?” Stamp it PERMIT.'},
 {kind:'RULE CHECK',place:'🏥 Hospital waiting room',jp:'ここで たばこを <ruby>吸<rt>す</rt></ruby>ってはいけません。',ro:'Koko de tabako o sutte wa ikemasen.',en:'A sign states: “Smoking is prohibited here.”',answer:'forbid',ex:'Exactly. <b>〜てはいけません</b> is the red-light rule: “You must not...”'},
 {kind:'STATUS SCAN',place:'🏙️ Apartment registry',jp:'ミラーさんは <ruby>大阪<rt>おおさか</rt></ruby>に <ruby>住<rt>す</rt></ruby>んでいます。',ro:'Miraa-san wa Osaka ni sunde imasu.',en:'What does the dossier report?',answer:'status',ex:'Yes. <b>住んでいます</b> is a continuing state: Mr. Miller lives in Osaka.'},
 {kind:'RULE CHECK',place:'📚 Library archive',jp:'この <ruby>資料<rt>しりょう</rt></ruby>を <ruby>借<rt>か</rt></ruby>りてもいいですか。',ro:'Kono shiryou o karitemo ii desu ka?',en:'A learner asks permission to borrow these materials.',answer:'permit',ex:'Right. It is a permission request: “May I borrow these materials?”'},
 {kind:'STATUS SCAN',place:'🏢 IMC headquarters',jp:'ワンさんは IMCで <ruby>働<rt>はたら</rt></ruby>いています。',ro:'Wan-san wa IMC de hataraite imasu.',en:'Choose the best report.',answer:'status',ex:'Correct. <b>働いています</b> reports an ongoing work/business state: “works at IMC.”'},
 {kind:'RULE CHECK',place:'🚇 Train platform',jp:'ここに <ruby>荷物<rt>にもつ</rt></ruby>を <ruby>置<rt>お</rt></ruby>いてはいけません。',ro:'Koko ni nimotsu o oite wa ikemasen.',en:'A station rule about luggage.',answer:'forbid',ex:'Correct: <b>置いてはいけません</b> — “Do not put luggage here.”'},
 {kind:'STATUS SCAN',place:'💍 City registry',jp:'サントスさんは <ruby>結婚<rt>けっこん</rt></ruby>しています。',ro:'Santosu-san wa kekkon shite imasu.',en:'Choose the best report.',answer:'status',ex:'Yes. <b>結婚しています</b> describes the resultant state: “is married,” not “is marrying.”'},
 {kind:'RULE CHECK',place:'🛍️ Department store',jp:'ここで <ruby>製品<rt>せいひん</rt></ruby>の カタログを もらってもいいですか。',ro:'Koko de seihin no katarogu o moratte mo ii desu ka?',en:'A shopper politely asks for a product catalogue.',answer:'permit',ex:'Correct. <b>もらってもいいですか</b>: “May I receive/get a catalogue?”'},
 {kind:'STATUS SCAN',place:'🚗 Car showroom',jp:'あの <ruby>店<rt>みせ</rt></ruby>は <ruby>車<rt>くるま</rt></ruby>を <ruby>売<rt>う</rt></ruby>っています。',ro:'Ano mise wa kuruma o utte imasu.',en:'Choose the best report.',answer:'status',ex:'Exactly. <b>売っています</b> means the shop is in the business of selling cars.'}
];
const assemblies=[
 {place:'🦷 Dentist reception',prompt:'Build: “May I make an appointment with the dentist?”',tiles:['歯医者さんに','予約を','しても','いいですか'],answer:'歯医者さんに|予約を|しても|いいですか',tip:'Permission formula: verb て-form + もいいですか.'},
 {place:'🚌 Bus terminal',prompt:'Build: “You must not look at the timetable here.”',tiles:['ここで','時刻表を','見ては','いけません'],answer:'ここで|時刻表を|見ては|いけません',tip:'Prohibition formula: verb て-form + はいけません.'}
];
const boss={place:'👁️ TRAP DETECTOR // knowledge anomaly',jp:'その <ruby>住所<rt>じゅうしょ</rt></ruby>を ______。',ro:'Sono juusho o ______.',en:'Choose: “I don’t know that address.”',options:[['知りません','I do not know'],['知っていません','⚠ ongoing-state trap'],['知りませんでした','I did not know']],answer:0,ex:'Trap neutralized! For present “don’t know,” Japanese uses <b>知りません</b>. “知っていません” is a classic Lesson 15 error.'};
function gloss(jp,ro,en){return `<div class="japanese">${furigana?jp:jp.replace(/<ruby>(.*?)<rt>.*?<\/rt><\/ruby>/g,'$1')}</div><div class="assist">${romaji?ro:''}</div><div class="meaning">${en}</div>`}
function start(){index=0;score=0;combo=0;correct=0;updateHud();renderCase()}
function intro(){scene.innerHTML=`<div class="mission"><span class="chapter">TOKYO MUNICIPAL LANGUAGE UNIT</span><div class="district">🗼</div><h1>Tokyo Rule Rush</h1><p>Inspect signs, visitors, and office dossiers. Your Japanese keeps the city moving.</p><div class="brief"><h2>Your Lesson 15 kit</h2><ul><li><b>Permit:</b> 〜てもいいですか / 〜てもいいです</li><li><b>Forbid:</b> 〜てはいけません</li><li><b>States & work:</b> 住んでいます・結婚しています・働いています・売っています</li><li><b>Boss trap:</b> 知りません — never 知っていません</li></ul></div><button class="play" id="begin">START SHIFT →</button></div>`;$('#begin').onclick=start}
function updateHud(){$('#score').textContent=String(score).padStart(4,'0');$('#combo').textContent='×'+combo;$('#timebar').style.width=timeLeft+'%'}
function renderCase(){clearInterval(timer);locked=false;timeLeft=100;let c=cases[index];if(index<cases.length){scene.innerHTML=`<div class="card"><div class="caseTop"><span class="type">${c.kind}</span><span class="caseNo">CASE ${index+1}/${cases.length+3}</span></div><div class="setting">${c.place}</div>${gloss(c.jp,c.ro,c.en)}<div class="choices"><button class="choice permit" data-a="permit"><b>✓ PERMIT</b><span>〜てもいいです</span></button><button class="choice forbid" data-a="forbid"><b>✕ FORBID</b><span>〜てはいけません</span></button><button class="choice status" data-a="status"><b>⌕ STATUS</b><span>〜ています report</span></button></div></div><div class="stamp" id="stamp"></div><div class="feedback" id="feedback"></div><button class="play next" id="next">NEXT CASE →</button>`;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(b.dataset.a,c.answer,c.ex));$('#next').onclick=()=>{index++;renderCase()};startTimer();return}if(index===cases.length){renderAssembly(0);return}if(index===cases.length+1){renderAssembly(1);return}if(index===cases.length+2){renderBoss();return}finish()}
function startTimer(){timer=setInterval(()=>{timeLeft-=.35;updateHud();if(timeLeft<=0){clearInterval(timer);answer('timeout','', 'Time out! Rules need quick instincts. Review the pattern and keep going.',true)}},100)}
function answer(chosen,ans,ex,timeout=false){if(locked)return;locked=true;clearInterval(timer);let ok=chosen===ans;let fb=$('#feedback'),stamp=$('#stamp');if(ok){correct++;combo++;let pts=100+combo*25+Math.floor(timeLeft);score+=pts;fb.className='feedback good';fb.innerHTML=`<b>✓ PERFECT INSPECTION! +${pts}</b><br>${ex}`;stamp.textContent='PERMIT!';stamp.className='stamp show ok';sfx('win');burst();floatText('+'+pts)}else{combo=0;fb.className='feedback bad';fb.innerHTML=`<b>${timeout?'⌛ SHIFT EXPIRED':'✕ NOT QUITE'}</b><br>${ex}`;stamp.textContent='RECHECK';stamp.className='stamp show no';scene.classList.add('shake');setTimeout(()=>scene.classList.remove('shake'),400);sfx('fail')}updateHud();$('#next').style.display='block'}
function renderAssembly(n){clearInterval(timer);locked=false;let a=assemblies[n],pool=[...a.tiles].sort(()=>Math.random()-.5);scene.innerHTML=`<div class="card"><div class="caseTop"><span class="type">SYNTAX SPRINT</span><span class="caseNo">CASE ${cases.length+n+1}/${cases.length+3}</span></div><div class="setting">${a.place}</div><div class="japanese" style="font-size:25px">${a.prompt}</div><div class="assembly"><div class="slots empty" id="slots"></div><div class="tiles" id="tiles">${pool.map((t,i)=>`<button class="tile" data-t="${t}" data-i="${i}">${t}</button>`).join('')}</div><div class="assemblyActions"><button class="smallBtn" id="undo">UNDO</button><button class="smallBtn check" id="check">CHECK SENTENCE</button></div></div></div><div class="feedback" id="feedback"></div><button class="play next" id="next">${n?'FACE THE BOSS →':'NEXT SPRINT →'}</button>`;let selected=[];function paint(){let slots=$('#slots');slots.classList.toggle('empty',!selected.length);slots.innerHTML=selected.map(x=>`<span class="tile">${x}</span>`).join('')}document.querySelectorAll('.tile[data-t]').forEach(b=>b.onclick=()=>{if(locked)return;selected.push(b.dataset.t);b.classList.add('used');paint();sfx('pop')});$('#undo').onclick=()=>{let last=selected.pop();if(last){let b=[...document.querySelectorAll('.tile[data-t]')].find(x=>x.dataset.t===last&&x.classList.contains('used'));if(b)b.classList.remove('used');paint()}};$('#check').onclick=()=>{if(locked)return;locked=true;let ok=selected.join('|')===a.answer,fb=$('#feedback');if(ok){correct++;combo++;let pts=200+combo*25;score+=pts;fb.className='feedback good';fb.innerHTML=`<b>✓ SENTENCE LOCKED! +${pts}</b><br>${a.tip}`;sfx('win');burst();floatText('+'+pts)}else{combo=0;fb.className='feedback bad';fb.innerHTML=`<b>✕ TILE JAM!</b><br>${a.tip} Correct order: <b>${a.answer.replaceAll('|',' ')}</b>`;sfx('fail')}updateHud();$('#next').style.display='block'};$('#next').onclick=()=>{index++;renderCase()}}
function renderBoss(){let b=boss;scene.innerHTML=`<div class="card boss"><div class="caseTop"><span class="type">BOSS: NEGATION TRAP</span><span class="caseNo">FINAL CASE</span></div><div class="setting">${b.place}</div>${gloss(b.jp,b.ro,b.en)}<div class="choices">${b.options.map((o,i)=>`<button class="choice" data-b="${i}"><b>${o[0]}</b><span>${o[1]}</span></button>`).join('')}</div></div><div class="stamp" id="stamp"></div><div class="feedback" id="feedback"></div><button class="play next" id="next">CLAIM YOUR BADGE →</button>`;document.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>answer(+x.dataset.b,b.answer,b.ex));$('#next').onclick=()=>{index++;renderCase()}}
function finish(){clearInterval(timer);let rank=correct>=10?'S':correct>=7?'A':correct>=4?'B':'C';scene.innerHTML=`<div class="card end"><div class="district">🏮</div><span class="chapter">SHIFT COMPLETE</span><h1>Tokyo is safe!</h1><div class="rank">${rank}</div><p>You kept the grammar gates clean. Your next real-world conversation just got easier.</p><div class="scoreBox"><div class="scoreItem"><b>${score}</b>POINTS</div><div class="scoreItem"><b>${correct}/12</b>CLEARED</div><div class="scoreItem"><b>×${combo}</b>FINAL COMBO</div></div><div class="lesson"><b>Lesson 15 power recap:</b> Ask/allow with 〜てもいいですか／〜てもいいです. Prohibit with 〜てはいけません. Use 〜ています for continuing states, habits, and jobs — but say <b>知りません</b> for “I don’t know.”</div><br><button class="play" id="again">PLAY AGAIN ↻</button></div>`;sfx('fanfare');burst(34);$('#again').onclick=start}
function sfx(type){if(!soundOn)return;let C=window.AudioContext||window.webkitAudioContext,ctx=new C(),now=ctx.currentTime;let notes=type==='win'?[523,659,784]:type==='fail'?[170,120]:type==='fanfare'?[392,523,659,784]:[420];notes.forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type=type==='fail'?'sawtooth':'square';o.frequency.value=f;g.gain.setValueAtTime(.07,now+i*.075);g.gain.exponentialRampToValueAtTime(.001,now+i*.075+.16);o.connect(g).connect(ctx.destination);o.start(now+i*.075);o.stop(now+i*.075+.18)})}
function burst(n=18){for(let i=0;i<n;i++){let x=document.createElement('i');x.className='confetti';x.style.left=(20+Math.random()*60)+'vw';x.style.top=(15+Math.random()*20)+'vh';x.style.background=['#ff4f64','#ffd166','#45d6b0','#38bdf8','#8b5cf6'][i%5];x.style.transform=`rotate(${Math.random()*180}deg)`;document.body.append(x);setTimeout(()=>x.remove(),1200)}}
function floatText(t){let e=document.createElement('div');e.className='float';e.textContent=t;e.style.left=(38+Math.random()*25)+'vw';e.style.top='45vh';document.body.append(e);setTimeout(()=>e.remove(),900)}
$('#furi').onclick=function(){furigana=!furigana;this.classList.toggle('on',furigana);if(index<cases.length&&index>=0)renderCase()};$('#roma').onclick=function(){romaji=!romaji;this.classList.toggle('on',romaji);if(index<cases.length&&index>=0)renderCase()};$('#sound').onclick=function(){soundOn=!soundOn;this.classList.toggle('on',soundOn);this.textContent=soundOn?'♫ SFX':'SFX OFF';if(soundOn)sfx('pop')};intro();
</script>
</body>
</html>
