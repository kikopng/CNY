<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI vs Roulette — Episode 1</title>
<style>
  :root {
    --bg: #05070c;
    --panel: rgba(14, 20, 32, 0.92);
    --panel-border: rgba(255, 255, 255, 0.14);
    --muted: #94a3b8;
    --white: #f8fafc;
    --cyan: #38bdf8;
    --green: #4ade80;
    --red: #f87171;
    --amber: #fbbf24;
    --violet: #a78bfa;
    --shadow: 0 24px 60px rgba(0,0,0,0.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  #appContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px 10px;
    width: 100%;
  }

  /* 9:16 YouTube Shorts Stage Frame */
  #stageWrap {
    position: relative;
    box-shadow: 0 25px 90px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.1);
    border-radius: 28px;
    overflow: hidden;
    background: #000;
  }

  #stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    transform-origin: top left;
    background: radial-gradient(circle at 50% 38%, #141f33 0%, #060911 55%, #020306 100%);
    overflow: hidden;
  }

  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle, transparent 35%, rgba(0,0,0,0.45) 75%, rgba(0,0,0,0.9) 100%);
  }

  /* In-Short Minimal HUD */
  #topHud {
    position: absolute;
    left: 48px;
    right: 48px;
    top: 48px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 40;
  }
  .hudBadge {
    border: 1px solid var(--panel-border);
    background: rgba(11, 17, 26, 0.85);
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 20px;
    font-weight: 850;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #e2e8f0;
  }
  .hudTag { color: var(--cyan); }

  #disclaimer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 240px;
    z-index: 40;
    font-size: 18px;
    letter-spacing: 0.16em;
    color: rgba(148, 163, 184, 0.65);
    text-transform: uppercase;
    font-weight: 750;
    white-space: nowrap;
  }

  /* Subtitles */
  #subtitle {
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: 305px;
    z-index: 60;
    display: flex;
    justify-content: center;
    pointer-events: none;
    min-height: 120px;
    align-items: center;
  }
  .subCard {
    display: inline-block;
    max-width: 960px;
    background: rgba(7, 11, 18, 0.94);
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-radius: 22px;
    padding: 18px 32px;
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.9);
    font-size: 40px;
    line-height: 1.32;
    font-weight: 850;
    letter-spacing: -0.015em;
    text-align: center;
    color: #ffffff;
    animation: subSpring 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes subSpring {
    from { opacity: 0; transform: scale(0.88) translateY(14px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .hl-cyan { color: var(--cyan); }
  .hl-green { color: var(--green); }
  .hl-amber { color: var(--amber); }
  .hl-red { color: var(--red); }

  #sceneRoot { position: absolute; inset: 0; z-index: 20; }

  /* Shorts Guide Overlay */
  #shortsGuide { position: absolute; inset: 0; pointer-events: none; z-index: 90; display: none; }
  .guideRightIcons {
    position: absolute; right: 24px; bottom: 300px; width: 90px;
    display: flex; flex-direction: column; gap: 34px; align-items: center;
  }
  .guideIcon {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.15); border: 1px dashed rgba(255, 255, 255, 0.4);
    display: grid; place-items: center; font-size: 15px; font-weight: 700;
  }
  .guideBottomBar {
    position: absolute; left: 40px; right: 140px; bottom: 40px; height: 150px;
    border: 1px dashed rgba(255, 255, 255, 0.3); border-radius: 16px;
    background: rgba(255, 255, 255, 0.05); padding: 16px;
    display: flex; flex-direction: column; justify-content: flex-end; font-size: 20px; color: #94a3b8;
  }

  /* External Controls (Outside 9:16 frame) */
  #externalControls {
    width: min(100vw - 32px, 580px);
    background: rgba(13, 18, 28, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }
  .timelineRow { display: flex; align-items: center; gap: 14px; }
  .timeText { font-size: 14px; font-weight: 700; color: var(--muted); min-width: 44px; }
  .scrubTrack {
    flex: 1; position: relative; height: 8px;
    background: rgba(255, 255, 255, 0.12); border-radius: 99px; cursor: pointer;
  }
  #progressBar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    border-radius: 99px;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
  }
  .btnRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .btn {
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff; padding: 9px 18px; border-radius: 12px; font-size: 14px;
    font-weight: 750; cursor: pointer; transition: all 0.2s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.16); }
  .btnPrimary { background: linear-gradient(135deg, #0284c7, #2563eb); }
  .btnToggleActive { background: rgba(56, 189, 248, 0.25); border-color: var(--cyan); color: var(--cyan); }

  /* Smooth Animation Keyframes (Applied Once On Mount) */
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .rouletteCanvas { position: absolute; left: 50%; transform: translate(-50%, -50%); }

  .heroCard {
    position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
    width: 880px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px;
    animation: heroZoom 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes heroZoom {
    from { opacity: 0; transform: translate(-50%, -46%) scale(0.92); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .heroPill {
    padding: 10px 24px; background: rgba(56, 189, 248, 0.14);
    border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 999px;
    color: var(--cyan); font-size: 24px; font-weight: 850; letter-spacing: 0.16em;
  }
  .megaNumber { font-size: 156px; font-weight: 950; letter-spacing: -0.05em; line-height: 0.9; }
  .versusTag { font-size: 60px; font-weight: 950; margin-top: 10px; }

  .simCard, .resultBox, .consoleBox, .chartBox {
    position: absolute; left: 70px; right: 70px; top: 220px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 36px; padding: 42px; box-shadow: var(--shadow);
    animation: cardDrop 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes cardDrop {
    from { opacity: 0; transform: translateY(-16px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .simCard, .consoleBox, .chartBox { height: 960px; display: flex; flex-direction: column; }
  
  .panelHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  .panelHeadTitle { font-size: 30px; font-weight: 900; letter-spacing: 0.08em; }
  .panelBadge {
    padding: 8px 18px; border-radius: 999px; background: rgba(74, 222, 128, 0.15);
    border: 1px solid rgba(74, 222, 128, 0.3); color: var(--green); font-size: 20px; font-weight: 800;
  }
  .twoCol { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .boxMetric { background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 24px; padding: 24px; }
  .metricLabel { font-size: 19px; color: var(--muted); font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .metricVal { font-size: 60px; font-weight: 900; margin-top: 10px; line-height: 1; }
  
  .spinTape { display: flex; gap: 16px; overflow: hidden; margin-top: auto; }
  .spinChip {
    min-width: 170px; background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; padding: 16px; text-align: center;
  }

  .profitPill {
    display: inline-flex; align-items: center; gap: 10px; padding: 14px 38px;
    border-radius: 999px; background: rgba(74, 222, 128, 0.16);
    border: 2px solid rgba(74, 222, 128, 0.45); font-size: 48px; font-weight: 950; color: var(--green);
    box-shadow: 0 0 35px rgba(74, 222, 128, 0.35);
    animation: profitPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes profitPop {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  .questionDramatic {
    position: absolute; left: 70px; right: 70px; top: 38%; transform: translateY(-50%);
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.16), rgba(245, 158, 11, 0.04));
    border: 2.5px solid rgba(251, 191, 36, 0.45); border-radius: 36px; padding: 60px 40px; text-align: center;
    box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
    animation: questionPunch 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes questionPunch {
    from { opacity: 0; transform: translateY(-44%) scale(0.88); }
    to { opacity: 1; transform: translateY(-50%) scale(1); }
  }
  .qBig {
    font-size: 96px; font-weight: 1000; color: var(--amber); letter-spacing: -0.02em;
    margin-top: 10px; text-shadow: 0 0 45px rgba(251, 191, 36, 0.55);
  }

  .testsGrid {
    position: absolute; left: 70px; right: 70px; top: 300px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  .testRow {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 20px; padding: 20px 24px; display: flex;
    justify-content: space-between; align-items: center; font-size: 24px; font-weight: 850;
  }

  .ratioWrap, .martingaleWrap, .ctaWrap {
    position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%);
    text-align: center; width: 880px;
  }
  .bigRatio {
    font-size: 230px; font-weight: 1000; line-height: 0.85; color: var(--green);
    text-shadow: 0 0 70px rgba(74, 222, 128, 0.45);
    animation: ratioPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes ratioPop {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }
  .ratioPill {
    display: inline-block; padding: 12px 36px; background: rgba(74, 222, 128, 0.15);
    border: 2px solid rgba(74, 222, 128, 0.4); border-radius: 999px;
    font-size: 42px; font-weight: 900; color: var(--green); margin-top: 24px;
  }

  .martTitle {
    font-size: 110px; font-weight: 1000; color: var(--amber); line-height: 0.95;
    text-shadow: 0 0 50px rgba(251, 191, 36, 0.45);
    animation: martSlam 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes martSlam {
    from { opacity: 0; transform: scale(1.2); }
    to { opacity: 1; transform: scale(1); }
  }
  .martChips {
    display: flex; justify-content: center; align-items: center; gap: 16px;
    margin-top: 48px; font-size: 48px; font-weight: 950;
  }
  .chipItem {
    padding: 16px 26px; background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
  }

  .stepsBox, .pairsWrap, .dangerBox {
    position: absolute; left: 70px; right: 70px; top: 220px; display: flex; flex-direction: column; gap: 18px;
  }
  .stepCard {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 24px; padding: 24px 32px; display: flex;
    justify-content: space-between; align-items: center; font-size: 32px; font-weight: 900;
  }

  .pairCardRow { display: grid; grid-template-columns: 1fr 100px 1fr; align-items: center; gap: 20px; }
  .betTargetCard {
    height: 175px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 26px; display: grid; place-items: center; font-size: 58px; font-weight: 950;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .dangerBanner {
    background: rgba(248, 113, 113, 0.14); border: 2px solid rgba(248, 113, 113, 0.4);
    border-radius: 26px; padding: 22px; text-align: center; color: var(--red);
    font-size: 34px; font-weight: 950; letter-spacing: 0.08em;
  }
  .ladderGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .ladderRow {
    background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px; padding: 18px 24px; display: flex; justify-content: space-between; font-size: 26px; font-weight: 850;
  }
  .wipeoutAlert {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(185, 28, 28, 0.15));
    border: 2px solid var(--red); border-radius: 26px; padding: 26px; text-align: center;
    box-shadow: 0 0 40px rgba(248, 113, 113, 0.3);
  }

  .ctaTitle { font-size: 96px; font-weight: 1000; line-height: 0.94; }
  .ep2Badge {
    padding: 16px 44px; background: linear-gradient(90deg, #0284c7, #38bdf8);
    border-radius: 999px; font-size: 34px; font-weight: 950; margin: 10px 0;
    box-shadow: 0 12px 35px rgba(56, 189, 248, 0.4);
  }
</style>
</head>
<body>

<div id="appContainer">
  <!-- 9:16 Shorts Stage -->
  <div id="stageWrap">
    <div id="stage">
      <div id="sceneRoot"></div>
      <div id="vignette"></div>

      <div id="topHud">
        <div class="hudBadge">EPISODE 1</div>
        <div class="hudBadge hudTag" id="timerBadge">00:00</div>
      </div>

      <div id="disclaimer">SIMULATION — NOT REAL MONEY</div>

      <div id="subtitle">
        <div class="subCard" id="subText"></div>
      </div>

      <div id="shortsGuide">
        <div class="guideRightIcons">
          <div class="guideIcon">👍</div>
          <div class="guideIcon">👎</div>
          <div class="guideIcon">💬</div>
          <div class="guideIcon">↗</div>
          <div class="guideIcon">🎵</div>
        </div>
        <div class="guideBottomBar">
          <div style="font-weight:900; color:#fff; margin-bottom:4px;">@AILabs • Subscribe</div>
          <div>I Gave AI $10,000 to Beat Roulette #shorts</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Controls Cleanly Outside Frame -->
  <div id="externalControls">
    <div class="timelineRow">
      <span class="timeText mono" id="timeCurrent">00:00</span>
      <div class="scrubTrack" id="scrubber">
        <div id="progressBar"></div>
      </div>
      <span class="timeText mono">00:52</span>
    </div>
    <div class="btnRow">
      <button class="btn btnPrimary" id="playBtn">▶ PLAY</button>
      <button class="btn" id="restartBtn">↺ RESTART</button>
      <button class="btn" id="muteBtn">🔊 SOUND ON</button>
      <button class="btn" id="overlayBtn">📱 SHORTS OVERLAY</button>
    </div>
    <div class="btnRow">
      <button class="btn" id="recordBtn">🎥 RECORD SHORT</button>
      <a class="btn btnPrimary" id="downloadLink" download="roulette_ai_episode1.webm" style="display:none; text-decoration:none;">⬇ DOWNLOAD VIDEO</a>
    </div>
    <div id="recordHint" style="display:none; font-size:13px; color:var(--muted); line-height:1.5; text-align:center;"></div>
  </div>
</div>

<script>
(() => {
  const DURATION = 52;
  const stage = document.getElementById('stage');
  const stageWrap = document.getElementById('stageWrap');
  const sceneRoot = document.getElementById('sceneRoot');
  const subText = document.getElementById('subText');
  const progressBar = document.getElementById('progressBar');
  const scrubber = document.getElementById('scrubber');
  const timeCurrent = document.getElementById('timeCurrent');
  const timerBadge = document.getElementById('timerBadge');
  const playBtn = document.getElementById('playBtn');
  const restartBtn = document.getElementById('restartBtn');
  const muteBtn = document.getElementById('muteBtn');
  const overlayBtn = document.getElementById('overlayBtn');
  const shortsGuide = document.getElementById('shortsGuide');
  const recordBtn = document.getElementById('recordBtn');
  const downloadLink = document.getElementById('downloadLink');
  const recordHint = document.getElementById('recordHint');

  let running = false;
  let muted = false;
  let startPerf = 0;
  let elapsed = 0;
  let raf = 0;
  let activeSceneIndex = -1;
  let activeSceneState = null;
  let showOverlay = false;

  /* --- Recording state (captures the 9:16 stage only, no external controls) --- */
  const OUT_W = 1080, OUT_H = 1920;
  let isRecording = false;
  let displayStream = null;
  let captureVideo = null;
  let captureCanvas = null;
  let captureCtx = null;
  let outStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let captureRAF = 0;

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtTime(t) {
    const s = Math.min(DURATION, Math.max(0, Math.floor(t)));
    return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  }

  function renderWheel(canvas, rot = 0, size = 680) {
    const ctx = canvas.getContext('2d');
    const cx = size / 2, cy = size / 2, r = (size / 2) - 30;
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);

    const reds = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
    const seg = (2 * Math.PI) / 37;

    for (let i = 0; i < 37; i++) {
      const a = i * seg - Math.PI / 2, b = a + seg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, a, b);
      ctx.closePath();
      ctx.fillStyle = i === 0 ? '#10b981' : (reds.has(i) ? '#e11d48' : '#1e293b');
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 2;
      ctx.stroke();

      const ta = a + seg / 2;
      ctx.save();
      ctx.rotate(ta);
      ctx.translate(r * 0.84, 0);
      ctx.rotate(Math.PI / 2);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(i), 0, 0);
      ctx.restore();
    }

    ctx.beginPath(); ctx.arc(0, 0, 56, 0, Math.PI * 2); ctx.fillStyle = '#d97706'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 44, 0, Math.PI * 2); ctx.fillStyle = '#0f172a'; ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.moveTo(cx, 10); ctx.lineTo(cx - 14, 34); ctx.lineTo(cx + 14, 34);
    ctx.closePath();
    ctx.fillStyle = '#fbbf24';
    ctx.fill();
  }

  function makeCanvas(size = 680) {
    const c = document.createElement('canvas');
    c.className = 'rouletteCanvas';
    c.width = size; c.height = size;
    return c;
  }

  /* --- DEFINING 12 SCENES (MOUNT ONCE, UPDATE VARIABLES AT 60FPS) --- */
  const scenes = [
    // Scene 0: Hook
    {
      a: 0, b: 3,
      sub: 'I gave AI <span class="hl-cyan">$10,000</span> and told it to beat <span class="hl-amber">roulette</span>.',
      mount(root) {
        const c = makeCanvas(600);
        c.style.top = '28%'; c.style.opacity = '0.35';
        root.append(c);

        const card = document.createElement('div');
        card.className = 'heroCard';
        card.innerHTML = `
          <div class="heroPill">EXPERIMENT #01</div>
          <div class="metricLabel">STARTING BANKROLL</div>
          <div class="megaNumber mono" id="heroMoney" style="color:var(--cyan);">$0</div>
          <div class="versusTag"><span class="hl-cyan">AI</span> VS <span class="hl-amber">ROULETTE</span></div>
        `;
        root.append(card);
        return { c, moneyEl: card.querySelector('#heroMoney') };
      },
      update(local, s) {
        renderWheel(s.c, local * 2.2, 600);
        const p = Math.min(1, local / 2.6);
        s.moneyEl.textContent = '$' + Math.round(p * 10000).toLocaleString();
      }
    },

    // Scene 1: 100 Spins Simulation
    {
      a: 3, b: 8,
      sub: 'I gave it <span class="hl-cyan">100 spins</span> and told it to decide what to bet every round.',
      mount(root) {
        const p = document.createElement('div');
        p.className = 'simCard';
        p.innerHTML = `
          <div class="panelHead">
            <div class="panelHeadTitle">AI ROULETTE ENGINE</div>
            <div class="panelBadge">● ACTIVE EVALUATION</div>
          </div>
          <div class="twoCol">
            <div class="boxMetric">
              <div class="metricLabel">BANKROLL</div>
              <div class="metricVal mono hl-cyan">$10,000</div>
            </div>
            <div class="boxMetric">
              <div class="metricLabel">SPINS EVALUATED</div>
              <div class="metricVal mono" id="spinsCounter" style="color:var(--amber);">0 / 100</div>
            </div>
          </div>

  /* --- ENGINE CONTROLLER --- */
  function updateSubtitles(idx) {
    const text = scenes[idx].sub;
    if (!text) {
      subText.style.display = 'none';
      return;
    }
    subText.style.display = 'inline-block';
    subText.innerHTML = text;
  }

  function goScene(t) {
    let idx = scenes.findIndex(s => t >= s.a && t < s.b);
    if (idx === -1) idx = scenes.length - 1;

    // Mount only when changing scene!
    if (idx !== activeSceneIndex) {
      sceneRoot.innerHTML = '';
      activeSceneIndex = idx;
      activeSceneState = scenes[idx].mount(sceneRoot);
      updateSubtitles(idx);
    }

    // Update smooth values every frame
    if (scenes[idx].update) {
      scenes[idx].update(t - scenes[idx].a, activeSceneState);
    }
  }

  function tick(now) {
    if (!running) return;
    elapsed = Math.min(DURATION, (now - startPerf) / 1000);
    goScene(elapsed);

    const pct = (elapsed / DURATION) * 100;
    progressBar.style.width = pct + '%';
    timeCurrent.textContent = fmtTime(elapsed);
    timerBadge.textContent = fmtTime(elapsed);

    if (elapsed >= DURATION) {
      pause();
      if (isRecording) stopRecording();
      return;
    }
    raf = requestAnimationFrame(tick);
  }

  function play() {
    if (running) return;
    if (elapsed >= DURATION) elapsed = 0;
    running = true;
    startPerf = performance.now() - elapsed * 1000;
    playBtn.textContent = '❚❚ PAUSE';
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    running = false;
    cancelAnimationFrame(raf);
    playBtn.textContent = '▶ PLAY';
  }

  function restart() {
    pause();
    elapsed = 0;
    activeSceneIndex = -1;
    progressBar.style.width = '0%';
    timeCurrent.textContent = '00:00';
    timerBadge.textContent = '00:00';
    goScene(0);
  }

  function seek(targetSec) {
    elapsed = Math.max(0, Math.min(DURATION, targetSec));
    startPerf = performance.now() - elapsed * 1000;
    goScene(elapsed);
    progressBar.style.width = ((elapsed / DURATION) * 100) + '%';
    timeCurrent.textContent = fmtTime(elapsed);
    timerBadge.textContent = fmtTime(elapsed);
  }

  playBtn.addEventListener('click', () => running ? pause() : play());
  restartBtn.addEventListener('click', () => { restart(); play(); });
  
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇 MUTED' : '🔊 SOUND ON';
  });

  overlayBtn.addEventListener('click', () => {
    showOverlay = !showOverlay;
    shortsGuide.style.display = showOverlay ? 'block' : 'none';
    overlayBtn.classList.toggle('btnToggleActive', showOverlay);
  });

  scrubber.addEventListener('click', (e) => {
    const rect = scrubber.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    seek(ratio * DURATION);
  });

  /* --- Screen recording: captures ONLY the #stage element (no external controls) ---
     Works by asking the browser to share this tab, then every frame we crop the
     shared video down to just the stage's on-screen rectangle and redraw that
     crop onto an offscreen canvas, which is what actually gets recorded. */
  function pickMimeType() {
    const candidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    for (const c of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
    }
    return '';
  }

  async function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder) {
      alert('Screen recording isn\'t supported in this browser. Try the latest Chrome or Edge on desktop.');
      return;
    }

    try {
      displayStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false });
    } catch (err) {
      return; // user cancelled the share prompt
    }

    // Hide the shorts guide overlay so it doesn't get baked into the video
    showOverlay = false;
    shortsGuide.style.display = 'none';
    overlayBtn.classList.remove('btnToggleActive');

    captureVideo = document.createElement('video');
    captureVideo.muted = true;
    captureVideo.playsInline = true;
    captureVideo.srcObject = displayStream;
    await captureVideo.play();

    captureCanvas = document.createElement('canvas');
    captureCanvas.width = OUT_W;
    captureCanvas.height = OUT_H;
    captureCtx = captureCanvas.getContext('2d');

    outStream = captureCanvas.captureStream(30);
    const mimeType = pickMimeType();
    mediaRecorder = new MediaRecorder(outStream, mimeType ? { mimeType, videoBitsPerSecond: 8000000 } : { videoBitsPerSecond: 8000000 });
    recordedChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = finishRecording;

    const track = displayStream.getVideoTracks()[0];
    if (track) track.addEventListener('ended', () => { if (isRecording) stopRecording(); });

    isRecording = true;
    recordBtn.textContent = '⏹ STOP RECORDING';
    recordBtn.classList.add('btnToggleActive');
    downloadLink.style.display = 'none';
    recordHint.style.display = 'block';
    recordHint.textContent = 'Recording… capturing just the 9:16 frame. Keep this tab visible.';

    mediaRecorder.start();
    captureFrame();

    // Play the short from the very beginning so the recording covers all 52s
    restart();
    play();
  }

  function captureFrame() {
    if (!isRecording) return;
    const rect = stage.getBoundingClientRect();
    const vw = captureVideo.videoWidth, vh = captureVideo.videoHeight;
    if (vw && vh && rect.width > 0 && rect.height > 0) {
      const scaleX = vw / window.innerWidth;
      const scaleY = vh / window.innerHeight;
      const sx = Math.max(0, rect.left * scaleX);
      const sy = Math.max(0, rect.top * scaleY);
      const sw = rect.width * scaleX;
      const sh = rect.height * scaleY;
      captureCtx.drawImage(captureVideo, sx, sy, sw, sh, 0, 0, OUT_W, OUT_H);
    }
    captureRAF = requestAnimationFrame(captureFrame);
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    cancelAnimationFrame(captureRAF);
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (displayStream) displayStream.getTracks().forEach(t => t.stop());
    recordBtn.textContent = '🎥 RECORD SHORT';
    recordBtn.classList.remove('btnToggleActive');
  }

  function finishRecording() {
    const blob = new Blob(recordedChunks, { type: (mediaRecorder && mediaRecorder.mimeType) || 'video/webm' });
    const url = URL.createObjectURL(blob);
    downloadLink.href = url;
    downloadLink.style.display = 'inline-block';
    recordHint.textContent = 'Recording ready — tap "Download Video" to save it.';
  }

  recordBtn.addEventListener('click', () => {
    if (isRecording) stopRecording();
    else startRecording();
  });

  function handleResize() {
    const margin = 140;
    const availWidth = window.innerWidth - 30;
    const availHeight = window.innerHeight - margin;
    const scale = Math.min(availWidth / 1080, availHeight / 1920);

    stage.style.transform = `scale(${scale})`;
    stageWrap.style.width = `${1080 * scale}px`;
    stageWrap.style.height = `${1920 * scale}px`;
  }

  window.addEventListener('resize', handleResize);
  handleResize();

  restart();
  setTimeout(play, 180);
})();
</script>
</body>
</html>
